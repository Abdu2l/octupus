[project]
name = "octupus"
version = "0.5.1"
description = "Octupus: blazing fast CLI scraper with tentacle crawls, hybrid anti-bot and RAG markdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "curl_cffi>=0.7",
  "selectolax>=0.3",
  "pydantic>=2.0",
  "orjson>=3.9",
  "lxml>=5.0",
  "uvloop>=0.19; sys_platform!='win32'",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
headers = ["browserforge>=2.0"]
all = ["playwright>=1.40", "browserforge>=2.0"]

[project.scripts]
octupus = "octupus.cli:main"
elitescrape = "octupus.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["octupus*"]
